# Publish to npm with Trusted Publishing (OIDC): no long-lived npm token, no 90-day expiry.
# One-time setup on npmjs.com: package lightning-wallet-mcp -> Settings -> Publishing access ->
# Trusted publisher -> GitHub Actions: owner lightningfaucet, repo lightning-wallet-mcp,
# workflow publish.yml, environment (blank). After that, pushing a tag vX.Y.Z (or running the
# workflow by hand) publishes that version with provenance.
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Refuse to publish a version that is not the package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"; PKG="$(node -p "require('./package.json').version")"
          [ "$TAG" = "$PKG" ] || { echo "tag $TAG != package.json $PKG"; exit 1; }
      - run: npm publish --provenance --access public
